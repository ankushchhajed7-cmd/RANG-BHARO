<html lang="hi">
<head>
<meta charset="utf-8">

  रंग भरो — Kids Coloring Book PWA
  Version : v1.0.0  (2026-10-21)
  Repo    : ankushchhajed7-cmd/RANG-BHARO
  Notes   : 227 built-in pictures (animals, birds, sea, cartoon,
            bhakti, nature, vehicles, fruits, toys, ABC, 1-10, स्वर),
            tap-to-fill + drag-color-to-fill, pinch zoom, undo,
            auto-save, share/save PNG, photo-of-book-page mode.
============================================================ -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>रंग भरो — Kids Coloring</title>
<meta name="theme-color" content="#2D2A5A">
<meta name="description" content="बच्चों के लिए रंग भरने की किताब — 200+ चित्र">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#FFF7EC; --ink:#2D2A5A; --ink2:#6B6890; --card:#FFFFFF; --line:#EFE6D8;
  --coral:#FF6B4A; --sun:#FFC233; --teal:#17B3A3; --violet:#7B61FF;
  --shadow:0 6px 18px rgba(45,42,90,.10), 0 1px 3px rgba(45,42,90,.08);
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.hide{display:none!important}

/* ---------- Home ---------- */
#home{min-height:100%;padding-bottom:40px}
.hero{background:linear-gradient(135deg,#2D2A5A 0%,#4A3F9B 60%,#6B4FC8 100%);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 54px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:auto -40px -60px auto;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,194,51,.35),transparent 70%)}
.hero .row{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.logo{width:52px;height:52px;border-radius:16px;background:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.18);flex:none}
.logo svg{width:40px;height:40px}
.hero h1{margin:0;font-size:28px;line-height:1;font-weight:800;letter-spacing:.3px}
.hero p{margin:4px 0 0;font-size:14px;opacity:.85;font-weight:500}
.hero .sp{flex:1}
.hbtn{height:40px;min-width:40px;padding:0 12px;border-radius:14px;background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px;backdrop-filter:blur(4px)}
.hbtn.install{background:var(--sun);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 12px;margin-top:-34px;position:sticky;top:0;z-index:5;scrollbar-width:none;background:linear-gradient(var(--bg) 70%,transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:42px;padding:0 16px;border-radius:21px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--coral);color:#fff}
.chip .e{font-size:18px}
.meta{padding:2px 18px 8px;color:var(--ink2);font-size:14px;font-weight:600;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:4px 16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;position:relative;text-align:left;transition:transform .12s}
.card:active{transform:scale(.97)}
.card .th{aspect-ratio:1;background:#fff;display:block;width:100%;border-bottom:1px solid var(--line)}
.card .nm{padding:7px 12px 9px;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .done{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;font-size:15px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.card .del{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;background:rgba(45,42,90,.75);color:#fff;font-size:16px;display:grid;place-items:center}
.card.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:auto;min-height:190px;background:linear-gradient(135deg,#FFE7D6,#FFF3C9);border:2px dashed #FFB38E;box-shadow:none;text-align:center;padding:14px}
.card.add .big{font-size:44px}
.card.add b{font-size:16px}
.card.add small{color:var(--ink2);font-size:13px;line-height:1.3}
.foot{text-align:center;color:var(--ink2);font-size:12px;padding:24px 0 8px;opacity:.8}

/* ---------- Paint ---------- */
#paint{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:20}
.bar{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:var(--card);box-shadow:0 2px 10px rgba(45,42,90,.08);z-index:3}
.ib{width:44px;height:44px;border-radius:14px;background:#F4EFFA;display:grid;place-items:center;font-size:20px;color:var(--ink);flex:none}
.ib:active{transform:scale(.93)}
.ib:disabled{opacity:.35}
.ib svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ib.pri{background:var(--coral)}.ib.pri svg{stroke:#fff}
.ttl{flex:1;min-width:0;font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none;display:grid;place-items:center}
#zoomBox{transform-origin:0 0;position:absolute;left:0;top:0;will-change:transform}
#view{display:block;background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(45,42,90,.15);touch-action:none}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:64px;border-radius:14px;background:rgba(255,255,255,.92);box-shadow:var(--shadow);font-size:26px;font-weight:800;color:var(--ink);display:grid;place-items:center;z-index:2}
#prev{left:4px}#next{right:4px}
#zreset{position:absolute;right:12px;bottom:12px;height:40px;padding:0 14px;border-radius:20px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;z-index:2;box-shadow:var(--shadow)}
.tray{background:var(--card);border-radius:26px 26px 0 0;box-shadow:0 -6px 20px rgba(45,42,90,.10);padding:10px 0 calc(10px + env(safe-area-inset-bottom));z-index:3}
.cur{display:flex;align-items:center;gap:10px;padding:0 16px 8px;font-weight:700;font-size:15px;color:var(--ink2)}
.cur i{width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);flex:none}
.cur span{flex:1}
.pal{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,52px);gap:10px;overflow-x:auto;padding:4px 16px 6px;scrollbar-width:none}
.pal::-webkit-scrollbar{display:none}
.sw{width:52px;height:52px;border-radius:50%;position:relative;box-shadow:inset 0 -5px 0 rgba(0,0,0,.14),0 2px 5px rgba(0,0,0,.12);touch-action:pan-x;transition:transform .12s}
.sw.on{transform:scale(1.08);box-shadow:0 0 0 4px #fff,0 0 0 7px var(--ink)}
.sw.white{border:2px solid var(--line)}
.sw.white:after{content:"🧽";position:absolute;inset:0;display:grid;place-items:center;font-size:22px}
.sw.magic{background:conic-gradient(#ff4d4d,#ffb300,#ffee58,#43d17a,#2fa8ff,#8a5cff,#ff4da6,#ff4d4d)}
.sw.magic:after{content:"✨";position:absolute;inset:0;display:grid;place-items:center;font-size:22px}
#ghost{position:fixed;width:64px;height:64px;border-radius:50%;pointer-events:none;z-index:50;transform:translate(-50%,-80%);box-shadow:0 8px 20px rgba(0,0,0,.25);border:4px solid #fff}

/* ---------- Misc ---------- */
#toast{position:fixed;left:50%;bottom:calc(200px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:16px;font-weight:600;font-size:15px;z-index:60;max-width:88vw;text-align:center;box-shadow:var(--shadow);transition:opacity .3s}
.modal{position:fixed;inset:0;background:rgba(30,27,60,.45);display:grid;place-items:center;z-index:70;padding:20px}
.modal .box{background:#fff;border-radius:24px;padding:22px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.modal h3{margin:0 0 6px;font-size:21px}
.modal p{margin:0 0 18px;color:var(--ink2);font-size:15px}
.modal .btns{display:flex;gap:10px}
.modal .btns button{flex:1;height:48px;border-radius:16px;font-weight:800;font-size:16px;background:#F4EFFA}
.modal .btns .ok{background:var(--coral);color:#fff}
.burst{position:fixed;pointer-events:none;z-index:40;font-size:22px;animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
.cropm{position:fixed;inset:0;background:#1E1B3C;z-index:75;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.cropm .ch{color:#fff;font-weight:800;font-size:18px}
.cropm .cw{position:relative;touch-action:none}
.cropm canvas{display:block;border-radius:6px}
.cropm i{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--sun);border:4px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.cropm .btns{display:flex;gap:12px;width:100%;max-width:360px}
.cropm .btns button{flex:1;height:50px;border-radius:16px;font-weight:800;font-size:16px;background:#3A3670;color:#fff}
.cropm .btns .ok{background:var(--coral)}
#busy{position:fixed;inset:0;background:rgba(255,247,236,.85);display:grid;place-items:center;z-index:80;font-weight:800;font-size:18px}
</style>
</head>
<body>
<!-- ============ HOME ============ -->
<div id="home">
  <div class="hero">
    <div class="row">
      <div class="logo"><svg viewBox="0 0 64 64"><path d="M32 6C17 6 6 17 6 31c0 12 9 21 20 21 4 0 5-2 5-4 0-3-3-4-3-7 0-3 3-5 6-5h7c10 0 17-6 17-15C58 13 46 6 32 6z" fill="#FFE2B8" stroke="#2D2A5A" stroke-width="3"/><circle cx="19" cy="27" r="5" fill="#FF6B4A"/><circle cx="27" cy="16" r="5" fill="#FFC233"/><circle cx="40" cy="15" r="5" fill="#17B3A3"/><circle cx="49" cy="25" r="5" fill="#7B61FF"/></svg></div>
      <div><h1>रंग भरो</h1><p>बच्चों की रंगीन ड्रॉइंग बुक</p></div>
      <div class="sp"></div>
      <button class="hbtn install hide" id="installBtn">📲 इंस्टॉल</button>
      <button class="hbtn" id="soundBtn" aria-label="sound">🔊</button>
    </div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="meta"><span id="countTxt"></span><span id="doneTxt"></span></div>
  <div class="grid" id="grid"></div>
  <div class="foot">रंग भरो v1.0.0 · Ankush New Vision</div>
  <input type="file" id="photoIn" accept="image/*" class="hide">
</div>

<!-- ============ PAINT ============ -->
<div id="paint" class="hide">
  <div class="bar">
    <button class="ib" id="backBtn" aria-label="back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ttl" id="pTitle"></div>
    <button class="ib" id="undoBtn" aria-label="undo"><svg viewBox="0 0 24 24"><path d="M9 7H4V2"/><path d="M4 7a9 9 0 1 1-1 8"/></svg></button>
    <button class="ib" id="clearBtn" aria-label="clear"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
    <button class="ib pri" id="shareBtn" aria-label="save"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg></button>
  </div>
  <div id="stage">
    <div id="zoomBox"><canvas id="view" width="1000" height="1000"></canvas></div>
    <button class="nav" id="prev">‹</button>
    <button class="nav" id="next">›</button>
    <button id="zreset" class="hide">⤢ पूरा चित्र</button>
  </div>
  <div class="tray">
    <div class="cur"><i id="curDot"></i><span id="curName"></span></div>
    <div class="pal" id="pal"></div>
  </div>
</div>
<div id="ghost" class="hide"></div>
<div id="toast" class="hide"></div>

<script>
/* ===== Rang Bharo picture library — core helpers =====
   Every subject is drawn in a 400x400 box (ground ≈ y 395).
   Closed shapes are white-filled with dark outline, so later shapes hide earlier ones.
   Class o = open line (no fill), k = solid dark, w = white highlight without outline,
   b1/b2 = "tube" outline trick (thick dark + thinner white on top). */
const f = n => +(+n).toFixed(1);
const A = o => Object.entries(o).map(([k, v]) => (v === undefined || v === null || v === false) ? '' : ` ${k}="${typeof v === 'number' ? f(v) : v}"`).join('');
const rot = (a, x, y) => a ? `rotate(${f(a)} ${f(x)} ${f(y)})` : null;
const C = (cx, cy, r, c) => `<circle${A({ cx, cy, r, class: c })}/>`;
const E = (cx, cy, rx, ry, a = 0, c) => `<ellipse${A({ cx, cy, rx, ry, class: c, transform: rot(a, cx, cy) })}/>`;
const R = (x, y, width, height, rx = 0, c, a = 0) => `<rect${A({ x, y, width, height, rx: rx || null, class: c, transform: rot(a, x + width / 2, y + height / 2) })}/>`;
const P = (d, c) => `<path${A({ d, class: c })}/>`;
const L = d => P(d, 'o');
const K = (x, y, r = 9) => C(x, y, r, 'k') + C(x + r * 0.35, y - r * 0.35, r * 0.3, 'w');
const G = (t, s) => `<g transform="${t}">${s}</g>`;
const poly = (pts, c) => `<polygon${A({ points: pts.map(p => f(p[0]) + ',' + f(p[1])).join(' '), class: c })}/>`;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const TX = (x, y, size, txt, cls = 't') => `<text${A({ x, y, 'font-size': size, 'text-anchor': 'middle', class: cls })}>${esc(txt)}</text>`;
const tube = (d, w = 40) => `<path d="${d}" class="b1" style="stroke-width:${w + 7}"/><path d="${d}" class="b2" style="stroke-width:${w}"/>`;
const smile = (x, y, w = 24, h = 12) => L(`M${x - w} ${y} Q${x} ${y + h * 2} ${x + w} ${y}`);
const cheeks = (x1, x2, y, rx = 16, ry = 9) => E(x1, y, rx, ry) + E(x2, y, rx, ry);
const mirror = s => G('translate(400 0) scale(-1 1)', s);

function bumps(cx, cy, rx, ry, n, a0 = 0, k = 0.62) {
  const pts = [];
  for (let i = 0; i <= n; i++) { const a = a0 + i * 2 * Math.PI / n; pts.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]); }
  let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
  for (let i = 1; i <= n; i++) {
    const ch = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    d += ` A${f(ch * k)} ${f(ch * k)} 0 0 1 ${f(pts[i][0])} ${f(pts[i][1])}`;
  }
  return d + 'Z';
}
const Bp = (cx, cy, rx, ry, n, a0, k) => P(bumps(cx, cy, rx, ry, n, a0, k));
function starPts(cx, cy, R1, r1, n = 5, a0 = -90) {
  const p = [];
  for (let i = 0; i < n * 2; i++) { const a = (a0 + i * 180 / n) * Math.PI / 180, rr = i % 2 ? r1 : R1; p.push([cx + rr * Math.cos(a), cy + rr * Math.sin(a)]); }
  return p;
}
const star = (cx, cy, R1, r1, n, a0) => poly(starPts(cx, cy, R1, r1 || R1 * 0.45, n, a0));
function flower(cx, cy, r, n = 6, a0 = 0) {
  let s = '';
  for (let i = 0; i < n; i++) { const a = a0 + i * 2 * Math.PI / n; s += E(cx + r * 0.62 * Math.cos(a), cy + r * 0.62 * Math.sin(a), r * 0.5, r * 0.3, a * 180 / Math.PI); }
  return s + C(cx, cy, r * 0.32);
}
const heart = (cx, cy, s) => P(`M${cx} ${cy + s * 0.9} C${cx - s * 1.4} ${cy + s * 0.05} ${cx - s * 0.95} ${cy - s * 1.0} ${cx} ${cy - s * 0.35} C${cx + s * 0.95} ${cy - s * 1.0} ${cx + s * 1.4} ${cy + s * 0.05} ${cx} ${cy + s * 0.9}Z`);
const cloud = (cx, cy, w) => P(`M${cx - w * 0.5} ${cy + w * 0.12} A${w * 0.16} ${w * 0.16} 0 0 1 ${cx - w * 0.36} ${cy - w * 0.1} A${w * 0.2} ${w * 0.2} 0 0 1 ${cx - w * 0.02} ${cy - w * 0.2} A${w * 0.18} ${w * 0.18} 0 0 1 ${cx + w * 0.32} ${cy - w * 0.08} A${w * 0.15} ${w * 0.15} 0 0 1 ${cx + w * 0.5} ${cy + w * 0.12}Z`);
function sun(cx, cy, r, rays = 10) {
  let d = '';
  for (let i = 0; i < rays; i++) { const a = i * 2 * Math.PI / rays; d += `M${f(cx + Math.cos(a) * (r + 14))} ${f(cy + Math.sin(a) * (r + 14))} L${f(cx + Math.cos(a) * (r + 44))} ${f(cy + Math.sin(a) * (r + 44))} `; }
  return L(d) + C(cx, cy, r);
}
const grass = (x, y, s = 1) => L(`M${x - 22 * s} ${y} L${x - 30 * s} ${y - 28 * s} M${x - 8 * s} ${y} L${x - 8 * s} ${y - 38 * s} M${x + 8 * s} ${y} L${x + 14 * s} ${y - 32 * s} M${x + 22 * s} ${y} L${x + 34 * s} ${y - 22 * s}`);
const smallFlower = (x, y, r = 26) => L(`M${x} ${y + r} L${x} ${y + r * 3}`) + E(x - r * 0.6, y + r * 2.3, r * 0.5, r * 0.25, -30) + flower(x, y, r, 5);
const flake = (x, y, r) => L(`M${x - r} ${y} L${x + r} ${y} M${x - r / 2} ${y - r * 0.87} L${x + r / 2} ${y + r * 0.87} M${x - r / 2} ${y + r * 0.87} L${x + r / 2} ${y - r * 0.87}`);
const bird = (x, y, s = 1) => L(`M${x - 22 * s} ${y} Q${x - 11 * s} ${y - 14 * s} ${x} ${y} Q${x + 11 * s} ${y - 14 * s} ${x + 22 * s} ${y}`);
const tree = (x, y, s = 1) => R(x - 14 * s, y - 90 * s, 28 * s, 90 * s, 4) + Bp(x, y - 140 * s, 70 * s, 62 * s, 9);
const pine = (x, y, s = 1) => R(x - 10 * s, y - 30 * s, 20 * s, 30 * s) + poly([[x - 55 * s, y - 30 * s], [x + 55 * s, y - 30 * s], [x, y - 110 * s]]) + poly([[x - 42 * s, y - 85 * s], [x + 42 * s, y - 85 * s], [x, y - 160 * s]]);
const bubble = (x, y, r) => C(x, y, r) + L(`M${x - r * 0.5} ${y - r * 0.1} Q${x - r * 0.45} ${y - r * 0.5} ${x - r * 0.1} ${y - r * 0.55}`);
const seaweed = (x, y, h, s = 1) => P(`M${x} ${y} Q${x - 30 * s} ${y - h * 0.3} ${x} ${y - h * 0.55} Q${x + 30 * s} ${y - h * 0.8} ${x} ${y - h} Q${x + 45 * s} ${y - h * 0.75} ${x + 18 * s} ${y - h * 0.5} Q${x - 8 * s} ${y - h * 0.28} ${x + 22 * s} ${y}Z`);
const shell = (x, y, s = 1) => P(`M${x - 30 * s} ${y} Q${x - 34 * s} ${y - 40 * s} ${x} ${y - 44 * s} Q${x + 34 * s} ${y - 40 * s} ${x + 30 * s} ${y}Z`) + L(`M${x} ${y} L${x} ${y - 42 * s} M${x} ${y} L${x - 18 * s} ${y - 36 * s} M${x} ${y} L${x + 18 * s} ${y - 36 * s}`);

/* ===== Backgrounds (1000x1000). Keep decoration in the top band / side margins. ===== */
const FR = R(18, 18, 964, 964, 36);
const BG = {

  for (let i = 0; i < n; i++) { const a = (i + 0.5) * 360 / n; s += G(`rotate(${a} 200 200)`, E(200, 128, 18, 30)); }

  for (let i = 0; i < k; i++) { const a = i * 2 * Math.PI / k; s += C(200 + 54 * Math.cos(a), 200 + 54 * Math.sin(a), 14); }
  s += flower(200, 200, 40, k > 6 ? 8 : 6);
  for (let i = 0; i < n; i++) { const a = (i + 0.5) * 2 * Math.PI / n; s += C(200 + 160 * Math.cos(a), 200 + 160 * Math.sin(a), 9); }
  return s;
}

  for (let y = 222; y < 360; y += 34) { d += `M${f(lx(y))} ${y} L${f(rx(Math.min(y + 70, 388)))} ${Math.min(y + 70, 388)} M${f(rx(y))} ${y} L${f(lx(Math.min(y + 70, 388)))} ${Math.min(y + 70, 388)} `; }
  return L(d);
}

  return {

/* ---------- photo of a colouring-book page → line art ---------- */
$('photoIn').onchange = async () => {
  const f = $('photoIn').files[0]; $('photoIn').value = ''; if (!f) return;

function cropUI(im) {

    document.body.appendChild(m);

    const maxW = Math.min(window.innerWidth - 32, 700), maxH = window.innerHeight * 0.66, sc = Math.min(maxW / im.width, maxH / im.height);
    const cw = Math.round(im.width * sc), chh = Math.round(im.height * sc);
    cv.width = cw * 2; cv.height = chh * 2; cv.style.width = cw + 'px'; cv.style.height = chh + 'px'; wrap.style.width = cw + 'px'; wrap.style.height = chh + 'px';
    let r = { x: cw * 0.06, y: chh * 0.06, w: cw * 0.88, h: chh * 0.88 };
    const hs = [...m.querySelectorAll('.cw i')];
    const draw = () => {
      cx.setTransform(2, 0, 0, 2, 0, 0); cx.drawImage(im, 0, 0, cw, chh);
      cx.fillStyle = 'rgba(20,18,40,.6)'; cx.beginPath(); cx.rect(0, 0, cw, chh); cx.rect(r.x, r.y + r.h, r.w, -r.h); cx.fill('evenodd');
      cx.strokeStyle = '#fff'; cx.lineWidth = 2.5; cx.setLineDash([8, 6]); cx.strokeRect(r.x, r.y, r.w, r.h); cx.setLineDash([]);
      [[r.x, r.y], [r.x + r.w, r.y], [r.x + r.w, r.y + r.h], [r.x, r.y + r.h]].forEach(([x, y], i) => { hs[i].style.left = x + 'px'; hs[i].style.top = y + 'px'; });
    };
    draw();
    let drag = null;
    wrap.addEventListener('pointerdown', e => {
      const b = wrap.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
      const h = e.target.dataset && e.target.dataset.h;
      drag = { h: h !== undefined ? +h : (x > r.x && x < r.x + r.w && y > r.y && y < r.y + r.h ? 'move' : null), x, y, r0: { ...r } };

    });
    wrap.addEventListener('pointermove', e => {
      if (!drag) return; const b = wrap.getBoundingClientRect(), x = Math.max(0, Math.min(cw, e.clientX - b.left)), y = Math.max(0, Math.min(chh, e.clientY - b.top)), q = drag.r0, mn = 40;
      if (drag.h === 'move') { r.x = Math.max(0, Math.min(cw - q.w, q.x + x - drag.x)); r.y = Math.max(0, Math.min(chh - q.h, q.y + y - drag.y)); }
      else {
        let x1 = q.x, y1 = q.y, x2 = q.x + q.w, y2 = q.y + q.h;
        if (drag.h === 0 || drag.h === 3) x1 = Math.min(x, x2 - mn); else x2 = Math.max(x, x1 + mn);
        if (drag.h === 0 || drag.h === 1) y1 = Math.min(y, y2 - mn); else y2 = Math.max(y, y1 + mn);
        r = { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };

    });

    m.querySelector('.no').onclick = () => { m.remove(); res(null); };
    m.querySelector('.ok').onclick = () => { m.remove(); res({ x: r.x / sc, y: r.y / sc, w: r.w / sc, h: r.h / sc }); };
  });
}
function photoToLineArt(im, cr) {

    const x0 = Math.max(0, xx - R), x1 = Math.min(W, xx + R + 1), y0 = Math.max(0, y - R), y1 = Math.min(W, y + R + 1);
    const sum = I[y1 * (W + 1) + x1] - I[y0 * (W + 1) + x1] - I[y1 * (W + 1) + x0] + I[y0 * (W + 1) + x0], m = sum / ((x1 - x0) * (y1 - y0));

  for (let i = 0; i < W * W; i++) {
    if (!out[i] || seen[i]) continue;
    let sp = 0, n = 0; st[sp++] = i; seen[i] = 1;
    while (sp) { const k = st[--sp]; comp[n++] = k; const y = (k / W) | 0, xx = k - y * W;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const yy = y + dy, x2 = xx + dx; if (yy < 0 || x2 < 0 || yy >= W || x2 >= W) continue; const q = yy * W + x2; if (out[q] && !seen[q]) { seen[q] = 1; st[sp++] = q; } } }
    if (n < 40) for (let q = 0; q < n; q++) out[comp[q]] = 0;

    const v = b ? 43 : 255; d[j] = d[j + 1] = d[j + 2] = v; d[j + 3] = 255;
  }
  x.putImageData(id, 0, 0);
  x.strokeStyle = '#2b2b2b'; x.lineWidth = 6; x.strokeRect((W - w) / 2, (W - h) / 2, w, h);

}
